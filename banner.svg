<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <style>
      .name { font: 700 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
      .title { font: 500 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e0f2fe; }
      .tags { font: 500 17px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #bae6fd; letter-spacing: 1px; }
      .fade { animation: fade 1.2s ease-out both; }
      .fade2 { animation: fade 1.2s ease-out 0.3s both; }
      .fade3 { animation: fade 1.2s ease-out 0.6s both; }
      @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .wave { animation: drift 8s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    </style>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <g class="wave" opacity="0.25">
    <path d="M0 225 C 200 200, 400 255, 600 225 S 1000 200, 1260 225 L 1260 260 L 0 260 Z" fill="#ffffff"/>
  </g>
  <path d="M0 240 C 250 220, 450 262, 700 240 S 1050 222, 1200 240 L 1200 260 L 0 260 Z" fill="#ffffff" opacity="0.12"/>
  <text x="600" y="105" text-anchor="middle" class="name fade">Ariba Memon</text>
  <text x="600" y="148" text-anchor="middle" class="title fade2">Senior Full Stack Developer · AI Agents &amp; Chatbots</text>
  <text x="600" y="185" text-anchor="middle" class="tags fade3">REACT.JS · NEXT.JS · TYPESCRIPT · NODE.JS · SHOPIFY · SUPABASE</text>
</svg>
